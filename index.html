<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nikky Lashes</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#fff5f8;
    color:#333;
}

/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#d76b9f,#a8326d);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    animation:saidaIntro 1s ease 3s forwards;
}

.intro-conteudo{
    text-align:center;
    color:white;
    animation:entradaLogo 1.2s ease;
}

.logo-nl{
    width:150px;
    height:150px;
    margin:auto;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.8);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    font-weight:bold;
    letter-spacing:4px;
    background:rgba(255,255,255,.12);
    box-shadow:0 10px 40px rgba(0,0,0,.2);
}

.intro-conteudo h1{
    margin-top:25px;
    font-size:38px;
}

.intro-conteudo p{
    margin-top:10px;
    font-size:18px;
    opacity:.9;
}

@keyframes entradaLogo{
    from{
        opacity:0;
        transform:scale(.6);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes saidaIntro{
    to{
        opacity:0;
        visibility:hidden;
    }
}

/* =========================
   CABEÇALHO
========================= */

header{
    background:linear-gradient(135deg,#df75a7,#a93670);
    color:white;
    text-align:center;
    padding:45px 20px;
}

header h1{
    font-size:42px;
}

header p{
    margin-top:10px;
    font-size:20px;
}

/* =========================
   FORMULÁRIO
========================= */

.container{
    max-width:650px;
    margin:45px auto;
    background:white;
    padding:40px;
    border-radius:30px;
    box-shadow:0 10px 35px rgba(120,50,90,.12);
}

h2{
    text-align:center;
    color:#a44d7d;
    font-size:32px;
    margin-bottom:10px;
}

.subtitulo{
    text-align:center;
    color:#777;
    margin-bottom:30px;
    font-size:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:22px;
    margin-bottom:8px;
    font-size:18px;
}

input,
select{
    width:100%;
    padding:18px;
    border:1px solid #ddd;
    border-radius:16px;
    font-size:18px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#c55b91;
}

.valor{
    margin-top:25px;
    padding:22px;
    background:#fff0f6;
    color:#a44d7d;
    text-align:center;
    font-size:25px;
    font-weight:bold;
    border-radius:18px;
}

button{
    width:100%;
    margin-top:30px;
    padding:20px;
    border:0;
    border-radius:18px;
    background:linear-gradient(135deg,#d66b9f,#ad3f77);
    color:white;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.mensagem{
    margin-top:25px;
    padding:20px;
    border-radius:18px;
    text-align:center;
    font-size:18px;
    display:none;
}

.sucesso{
    display:block;
    background:#e9f9ef;
    color:#28734b;
}

.erro{
    display:block;
    background:#ffe9e9;
    color:#a52828;
}

/* =========================
   RODAPÉ
========================= */

footer{
    text-align:center;
    padding:30px;
    color:#888;
}

/* CELULAR */

@media(max-width:600px){

    header h1{
        font-size:34px;
    }

    .container{
        margin:25px 15px;
        padding:25px 20px;
    }

    h2{
        font-size:29px;
    }

    .logo-nl{
        width:130px;
        height:130px;
        font-size:48px;
    }

    .intro-conteudo h1{
        font-size:32px;
    }
}
</style>
</head>

<body>

<!-- =========================
     INTRO NL
========================= -->

<div id="intro">

    <div class="intro-conteudo">

        <div class="logo-nl">
            NL
        </div>

        <h1>Nikky Lashes</h1>

        <p>Realce sua beleza ✨</p>

    </div>

</div>


<!-- =========================
     CABEÇALHO
========================= -->

<header>

    <h1>✨ Nikky Lashes</h1>

    <p>Realce sua beleza, agende seu horário</p>

</header>


<!-- =========================
     AGENDA
========================= -->

<div class="container">

    <h2>Agende seu horário</h2>

    <p class="subtitulo">
        Escolha o melhor dia e horário para você.
    </p>


    <form id="formAgendamento">

        <label>Nome da cliente</label>

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
            required
        >


        <label>WhatsApp</label>

        <input
            type="tel"
            id="whatsapp"
            placeholder="(11) 99999-9999"
            required
        >


        <label>Dia</label>

        <select id="data" required>

            <option value="">
                Escolha o dia
            </option>

        </select>


        <label>Horário</label>

        <select id="horario" required disabled>

            <option value="">
                Escolha primeiro o dia
            </option>

        </select>


        <label>Modelo de cílios</label>

        <select id="modelo" required>

            <option value="">
                Selecione o modelo
            </option>

            <option value="Clássico" data-valor="100">
                Clássico — R$ 100,00
            </option>

            <option value="Volume Brasileiro" data-valor="120">
                Volume Brasileiro — R$ 120,00
            </option>

            <option value="Volume Russo" data-valor="140">
                Volume Russo — R$ 140,00
            </option>

            <option value="Volume Híbrido" data-valor="130">
                Volume Híbrido — R$ 130,00
            </option>

            <option value="Mega Volume" data-valor="160">
                Mega Volume — R$ 160,00
            </option>

            <option value="Manutenção" data-valor="90">
                Manutenção — R$ 90,00
            </option>

        </select>


        <div class="valor" id="valor">
            Valor do procedimento: R$ 0,00
        </div>


        <button
            type="submit"
            id="botao"
        >
            Confirmar agendamento
        </button>

    </form>


    <div
        id="mensagem"
        class="mensagem"
    ></div>

</div>


<footer>
    Nikky Lashes ✨
</footer>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://annmuqmsdjzysusnfklf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_L_EQc3998bYRyLap6B9Jzg_sDfz5wuV";


/* ==========================================
   ELEMENTOS
========================================== */

const dataSelect =
document.getElementById("data");

const horarioSelect =
document.getElementById("horario");

const modeloSelect =
document.getElementById("modelo");

const valorDiv =
document.getElementById("valor");

const form =
document.getElementById("formAgendamento");

const mensagem =
document.getElementById("mensagem");

const botao =
document.getElementById("botao");


/* ==========================================
   HORÁRIOS DO STUDIO
========================================== */

const horarios = [
    "09:00",
    "10:00",
    "11:00",
    "12:00",
    "13:00",
    "14:00",
    "15:00",
    "16:00",
    "17:00",
    "18:00"
];


/* ==========================================
   CRIAR DIAS
========================================== */

function criarDias(){

    const hoje = new Date();

    for(let i = 0; i < 60; i++){

        const data = new Date(hoje);

        data.setDate(
            hoje.getDate() + i
        );

        const ano =
            data.getFullYear();

        const mes =
            String(data.getMonth()+1)
            .padStart(2,"0");

        const dia =
            String(data.getDate())
            .padStart(2,"0");

        const valor =
            `${ano}-${mes}-${dia}`;

        const texto =
            `${dia}/${mes}/${ano}`;

        const option =
            document.createElement("option");

        option.value = valor;

        option.textContent = texto;

        dataSelect.appendChild(option);
    }
}


/* ==========================================
   BUSCAR HORÁRIOS OCUPADOS
========================================== */

async function carregarHorarios(){

    const data =
        dataSelect.value;

    horarioSelect.innerHTML =
        '<option value="">Carregando horários...</option>';

    horarioSelect.disabled = true;

    if(!data){

        horarioSelect.innerHTML =
            '<option value="">Escolha primeiro o dia</option>';

        return;
    }

    try{

        const resposta =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/horarios_ocupados",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    },

                    body:JSON.stringify({
                        p_data:data
                    })
                }
            );


        const dados =
            await resposta.json();


        if(!resposta.ok){

            throw new Error(
                JSON.stringify(dados)
            );
        }


        const ocupados =
            dados.map(item =>
                String(item.horario)
                .substring(0,5)
            );


        horarioSelect.innerHTML =
            '<option value="">Escolha o horário</option>';


        horarios.forEach(hora => {

            const option =
                document.createElement("option");

            option.value = hora;


            if(ocupados.includes(hora)){

                option.disabled = true;

                option.textContent =
                    hora + " - OCUPADO";

            }else{

                option.textContent =
                    hora;
            }


            horarioSelect.appendChild(option);

        });


        horarioSelect.disabled = false;

    }catch(erro){

        console.error(erro);

        horarioSelect.innerHTML =
            '<option value="">Erro ao carregar horários</option>';

    }

}


/* ==========================================
   ALTERAÇÃO DO DIA
========================================== */

dataSelect.addEventListener(
    "change",
    carregarHorarios
);


/* ==========================================
   MOSTRAR VALOR
========================================== */

modeloSelect.addEventListener(
    "change",
    function(){

        const opcao =
            modeloSelect.options[
                modeloSelect.selectedIndex
            ];

        const valor =
            Number(
                opcao.dataset.valor || 0
            );

        valorDiv.textContent =
            "Valor do procedimento: R$ " +
            valor.toFixed(2)
                .replace(".",",");
    }
);


/* ==========================================
   ENVIAR AGENDAMENTO
========================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        mensagem.className =
            "mensagem";

        mensagem.style.display =
            "none";


        botao.disabled = true;

        botao.textContent =
            "Agendando...";


        const nome =
            document.getElementById("nome")
            .value.trim();

        const whatsapp =
            document.getElementById("whatsapp")
            .value.trim();

        const data =
            dataSelect.value;

        const horario =
            horarioSelect.value;

        const modelo =
            modeloSelect.value;


        const opcao =
            modeloSelect.options[
                modeloSelect.selectedIndex
            ];

        const valor =
            Number(
                opcao.dataset.valor || 0
            );


        try{

            const resposta =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/rpc/fazer_agendamento",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json",

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY
                        },

                        body:JSON.stringify({

                            p_nome:
                                nome,

                            p_whatsapp:
                                whatsapp,

                            p_data:
                                data,

                            p_horario:
                                horario,

                            p_modelo:
                                modelo,

                            p_valor:
                                valor

                        })
                    }
                );


            const resultado =
                await resposta.json();


            if(!resposta.ok){

                throw new Error(
                    JSON.stringify(resultado)
                );
            }


            if(
                resultado &&
                resultado.sucesso === false
            ){

                throw new Error(
                    resultado.mensagem ||
                    "Horário indisponível."
                );
            }


            mensagem.className =
                "mensagem sucesso";


            mensagem.innerHTML = `
                ✅ <strong>Agendamento realizado com sucesso!</strong>
                <br><br>
                Cliente: ${nome}
                <br>
                Data: ${data.split("-").reverse().join("/")}
                <br>
                Horário: ${horario}
                <br>
                Modelo: ${modelo}
                <br>
                Valor: R$ ${valor.toFixed(2).replace(".",",")}
                <br><br>
                💕 Obrigada por escolher a Nikky Lashes!
            `;


            mensagem.style.display =
                "block";


            form.reset();


            valorDiv.textContent =
                "Valor do procedimento: R$ 0,00";


            horarioSelect.innerHTML =
                '<option value="">Escolha primeiro o dia</option>';

            horarioSelect.disabled =
                true;


        }catch(erro){

            console.error(erro);


            mensagem.className =
                "mensagem erro";


            mensagem.innerHTML =
                "❌ Não foi possível realizar o agendamento.<br><br>" +
                "Esse horário pode ter sido reservado por outra cliente. " +
                "Atualize a página e tente novamente.";


            mensagem.style.display =
                "block";

        }


        botao.disabled =
            false;

        botao.textContent =
            "Confirmar agendamento";

    }
);


/* ==========================================
   INICIAR
========================================== */

criarDias();

</script>

</body>
</html>
