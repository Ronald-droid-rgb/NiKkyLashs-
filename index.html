<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nikky Lashes | Agendamento</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #fdf7fa;
  color: #333;
  min-height: 100vh;
}

.topo {
  background: linear-gradient(135deg, #d98bb2, #a94f7e);
  color: white;
  text-align: center;
  padding: 35px 20px;
}

.topo h1 {
  font-size: 32px;
  margin-bottom: 8px;
}

.topo p {
  font-size: 16px;
}

.container {
  max-width: 600px;
  margin: 25px auto;
  padding: 0 18px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.titulo {
  text-align: center;
  margin-bottom: 25px;
}

.titulo h2 {
  color: #a94f7e;
  margin-bottom: 7px;
}

.titulo p {
  color: #777;
  font-size: 14px;
}

.campo {
  margin-bottom: 18px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
  font-size: 14px;
}

input,
select {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  background: white;
  outline: none;
}

input:focus,
select:focus {
  border-color: #c66c99;
}

.linha {
  display: flex;
  gap: 12px;
}

.linha .campo {
  flex: 1;
}

.valor {
  background: #fff3f8;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 20px;
  text-align: center;
  color: #a94f7e;
  font-weight: bold;
  font-size: 18px;
}

.botao {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 16px;
  background: linear-gradient(135deg, #d98bb2, #a94f7e);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.botao:disabled {
  opacity: .6;
}

.mensagem {
  display: none;
  margin-top: 18px;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-weight: bold;
  line-height: 1.6;
}

.sucesso {
  display: block;
  background: #e9f9ef;
  color: #267346;
}

.erro {
  display: block;
  background: #fff0f0;
  color: #a83232;
}

.carregando {
  text-align: center;
  color: #a94f7e;
  font-size: 13px;
  margin-bottom: 15px;
}

.rodape {
  text-align: center;
  color: #999;
  font-size: 13px;
  padding: 25px;
}

@media(max-width:500px) {
  .linha {
    flex-direction: column;
    gap: 0;
  }

  .topo h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<header class="topo">
  <h1>✨ Nikky Lashes</h1>
  <p>Realce sua beleza, agende seu horário</p>
</header>

<main class="container">

<div class="card">

<div class="titulo">
  <h2>Agende seu horário</h2>
  <p>Escolha o melhor dia e horário para você.</p>
</div>

<form id="formAgendamento">

<div class="campo">
<label for="nome">Nome da cliente</label>
<input
  type="text"
  id="nome"
  placeholder="Digite seu nome"
  required
>
</div>

<div class="campo">
<label for="whatsapp">WhatsApp</label>
<input
  type="tel"
  id="whatsapp"
  placeholder="(11) 99999-9999"
  required
>
</div>

<div class="linha">

<div class="campo">
<label for="data">Dia</label>
<input
  type="date"
  id="data"
  required
>
</div>

<div class="campo">
<label for="horario">Horário</label>

<select id="horario" required>

<option value="">Escolha</option>

<option value="08:00">08:00</option>
<option value="09:00">09:00</option>
<option value="10:00">10:00</option>
<option value="11:00">11:00</option>
<option value="12:00">12:00</option>
<option value="13:00">13:00</option>
<option value="14:00">14:00</option>
<option value="15:00">15:00</option>
<option value="16:00">16:00</option>
<option value="17:00">17:00</option>
<option value="18:00">18:00</option>
<option value="19:00">19:00</option>

</select>
</div>

</div>

<div id="carregando" class="carregando"></div>

<div class="campo">

<label for="modelo">Modelo de cílios</label>

<select id="modelo" required>

<option value="">Selecione o modelo</option>

<option value="Clássico">Clássico</option>
<option value="Volume Brasileiro">Volume Brasileiro</option>
<option value="Volume Russo">Volume Russo</option>
<option value="Volume Híbrido">Volume Híbrido</option>
<option value="Mega Volume">Mega Volume</option>
<option value="Manutenção">Manutenção</option>

</select>

</div>

<div class="valor">
Valor do procedimento:
<span id="valor">R$ 0,00</span>
</div>

<button
  class="botao"
  id="botao"
  type="submit"
>
Confirmar agendamento
</button>

<div id="mensagem" class="mensagem"></div>

</form>

</div>

</main>

<footer class="rodape">
Nikky Lashes © 2026<br>
Agendamento online
</footer>


<script>

/* ==========================================
   CONFIGURAÇÃO DO SUPABASE
========================================== */

const SUPABASE_URL =
"https://annmuqmsdjzysusnfklf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_L_EQc3998bYRyLap6B9Jzg_sDfz5wuV";


/* ==========================================
   ELEMENTOS
========================================== */

const modelo = document.getElementById("modelo");
const valor = document.getElementById("valor");
const data = document.getElementById("data");
const horario = document.getElementById("horario");
const formulario = document.getElementById("formAgendamento");
const mensagem = document.getElementById("mensagem");
const carregando = document.getElementById("carregando");
const botao = document.getElementById("botao");


/* ==========================================
   PREÇOS
========================================== */

const precos = {

  "Clássico": 100,

  "Volume Brasileiro": 120,

  "Volume Russo": 140,

  "Volume Híbrido": 130,

  "Mega Volume": 160,

  "Manutenção": 90

};


/* ==========================================
   DATA MÍNIMA
========================================== */

const hoje = new Date();

const ano = hoje.getFullYear();

const mes = String(
  hoje.getMonth() + 1
).padStart(2, "0");

const dia = String(
  hoje.getDate()
).padStart(2, "0");

data.min = `${ano}-${mes}-${dia}`;


/* ==========================================
   MOSTRAR VALOR
========================================== */

modelo.addEventListener("change", function() {

  const preco = precos[this.value] || 0;

  valor.textContent =
    preco.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    });

});


/* ==========================================
   BUSCAR HORÁRIOS OCUPADOS
========================================== */

async function carregarHorarios() {

  const dataEscolhida = data.value;

  if (!dataEscolhida) {
    return;
  }

  carregando.textContent =
    "Verificando horários disponíveis...";

  botao.disabled = true;

  try {

    const resposta = await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/horarios_ocupados",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        },

        body: JSON.stringify({
          p_data: dataEscolhida
        })
      }
    );


    if (!resposta.ok) {

      const erro = await resposta.text();

      throw new Error(erro);

    }


    const ocupados = await resposta.json();


    const horariosOcupados =
      ocupados.map(item =>
        String(item.horario).substring(0,5)
      );


    for (const opcao of horario.options) {

      if (!opcao.value) continue;

      const ocupado =
        horariosOcupados.includes(opcao.value);

      opcao.disabled = ocupado;

      if (ocupado) {

        opcao.textContent =
          opcao.value + " - OCUPADO";

      } else {

        opcao.textContent =
          opcao.value;

      }

    }


    horario.value = "";

    carregando.textContent =
      horariosOcupados.length === 0
      ? "Todos os horários estão disponíveis."
      : "Os horários ocupados estão bloqueados.";


  } catch (erro) {

    console.error(erro);

    carregando.textContent =
      "Não foi possível verificar os horários.";

    mostrarMensagem(
      "Não foi possível carregar os horários. Tente novamente.",
      false
    );

  }

  botao.disabled = false;

}


/* ==========================================
   QUANDO ESCOLHER A DATA
========================================== */

data.addEventListener(
  "change",
  carregarHorarios
);


/* ==========================================
   FAZER AGENDAMENTO
========================================== */

formulario.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    mensagem.style.display = "none";

    const nome =
      document.getElementById("nome").value.trim();

    const whatsapp =
      document.getElementById("whatsapp").value.trim();

    const dataEscolhida =
      data.value;

    const horarioEscolhido =
      horario.value;

    const modeloEscolhido =
      modelo.value;

    const preco =
      precos[modeloEscolhido] || 0;


    if (!nome ||
        !whatsapp ||
        !dataEscolhida ||
        !horarioEscolhido ||
        !modeloEscolhido) {

      mostrarMensagem(
        "Preencha todos os campos.",
        false
      );

      return;
    }


    botao.disabled = true;

    botao.textContent =
      "Agendando...";


    try {

      const resposta = await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/fazer_agendamento",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          },

          body: JSON.stringify({

            p_nome: nome,

            p_whatsapp: whatsapp,

            p_data: dataEscolhida,

            p_horario: horarioEscolhido,

            p_modelo: modeloEscolhido,

            p_valor: preco

          })
        }
      );


      if (!resposta.ok) {

        const erro =
          await resposta.text();

        throw new Error(erro);

      }


      const resultado =
        await resposta.json();


      if (!resultado.sucesso) {

        mostrarMensagem(
          resultado.mensagem ||
          "Este horário não está disponível.",
          false
        );

        await carregarHorarios();

        return;

      }


      const dataFormatada =
        new Date(
          dataEscolhida + "T00:00:00"
        ).toLocaleDateString("pt-BR");


      mostrarMensagem(

        "✅ Agendamento realizado com sucesso!<br><br>" +

        "Cliente: " + nome + "<br>" +

        "Data: " + dataFormatada + "<br>" +

        "Horário: " + horarioEscolhido + "<br>" +

        "Modelo: " + modeloEscolhido + "<br>" +

        "Valor: " +

        preco.toLocaleString(
          "pt-BR",
          {
            style: "currency",
            currency: "BRL"
          }
        ),

        true

      );


      formulario.reset();

      valor.textContent =
        "R$ 0,00";

      carregando.textContent =
        "";


    } catch (erro) {

      console.error(erro);

      mostrarMensagem(
        "Erro ao realizar o agendamento. Tente novamente.",
        false
      );

    } finally {

      botao.disabled = false;

      botao.textContent =
        "Confirmar agendamento";

    }

  }
);


/* ==========================================
   MENSAGEM
========================================== */

function mostrarMensagem(
  texto,
  sucesso
) {

  mensagem.innerHTML = texto;

  mensagem.className =
    sucesso
    ? "mensagem sucesso"
    : "mensagem erro";

  mensagem.style.display = "block";

  mensagem.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}

</script>

</body>
</html>
