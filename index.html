<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nikky Lashes</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Georgia, "Times New Roman", serif;
    background:#080808;
    color:#eee;
}


/* =====================================================
   INTRO
===================================================== */

#intro{
    position:fixed;
    inset:0;
    z-index:99999;

    background:#000;

    display:flex;
    justify-content:center;
    align-items:center;

    animation:
        introSaida 1.2s ease 3.5s forwards;
}

.intro-conteudo{
    text-align:center;

    animation:
        logoEntrada 1.5s ease forwards;
}


/* LOGO NL */

.logo{
    position:relative;

    width:270px;
    height:190px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#e8c985;

    font-family:
        "Times New Roman",
        Georgia,
        serif;

    font-size:105px;
    font-weight:400;

    letter-spacing:-30px;

    text-shadow:
        0 0 5px rgba(232,201,133,.25),
        0 0 25px rgba(232,201,133,.12);
}


/* detalhes decorativos */

.logo::before{
    content:"";
    position:absolute;

    width:220px;
    height:1px;

    background:linear-gradient(
        to right,
        transparent,
        #e8c985,
        transparent
    );

    bottom:25px;
    left:25px;
}

.logo::after{
    content:"✦";

    position:absolute;

    color:#e8c985;

    font-size:18px;

    bottom:4px;
    left:50%;

    transform:translateX(-50%);
}


.intro-conteudo h1{
    margin-top:15px;

    color:#e8c985;

    font-size:36px;
    font-weight:400;

    letter-spacing:5px;
}

.intro-conteudo p{
    margin-top:13px;

    color:#aaa;

    font-family:Arial,sans-serif;

    font-size:14px;

    letter-spacing:4px;

    text-transform:uppercase;
}


/* animações */

@keyframes logoEntrada{

    0%{
        opacity:0;
        transform:scale(.75);
    }

    60%{
        opacity:1;
        transform:scale(1.04);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes introSaida{

    0%{
        opacity:1;
        visibility:visible;
    }

    100%{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}


/* =====================================================
   CABEÇALHO
===================================================== */

header{

    background:
        linear-gradient(
            135deg,
            #050505,
            #17130b,
            #050505
        );

    border-bottom:1px solid #b8954d;

    text-align:center;

    padding:45px 20px;
}

header h1{

    color:#e8c985;

    font-size:40px;

    letter-spacing:2px;
}

header p{

    margin-top:12px;

    color:#aaa;

    font-family:Arial,sans-serif;

    font-size:17px;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    max-width:650px;

    margin:45px auto;

    padding:40px;

    background:
        linear-gradient(
            145deg,
            #121212,
            #090909
        );

    border:1px solid #4e4128;

    border-radius:25px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.7);
}


/* =====================================================
   TÍTULO
===================================================== */

h2{

    text-align:center;

    color:#e8c985;

    font-size:31px;

    font-weight:400;

    letter-spacing:1px;
}

.subtitulo{

    text-align:center;

    margin-top:10px;
    margin-bottom:30px;

    color:#999;

    font-family:Arial,sans-serif;

    font-size:16px;
}


/* =====================================================
   CAMPOS
===================================================== */

label{

    display:block;

    margin-top:22px;
    margin-bottom:8px;

    color:#d8c08a;

    font-family:Arial,sans-serif;

    font-weight:bold;

    font-size:16px;
}

input,
select{

    width:100%;

    padding:17px;

    border-radius:13px;

    border:1px solid #51452d;

    background:#111;

    color:#eee;

    font-family:Arial,sans-serif;

    font-size:17px;

    outline:none;
}

input::placeholder{

    color:#777;
}

input:focus,
select:focus{

    border-color:#d8b96c;

    box-shadow:
        0 0 0 2px rgba(216,185,108,.12);
}


/* =====================================================
   VALOR
===================================================== */

.valor{

    margin-top:25px;

    padding:21px;

    border-radius:15px;

    text-align:center;

    background:
        linear-gradient(
            135deg,
            #17130c,
            #0c0c0c
        );

    border:1px solid #725d32;

    color:#e8c985;

    font-family:Arial,sans-serif;

    font-size:21px;

    font-weight:bold;
}


/* =====================================================
   BOTÃO
===================================================== */

button{

    width:100%;

    margin-top:30px;

    padding:19px;

    border:1px solid #e8c985;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #c6a45b,
            #e8c985,
            #b58d42
        );

    color:#080808;

    font-family:Arial,sans-serif;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 6px 20px rgba(0,0,0,.4);

    transition:.2s;
}

button:active{

    transform:scale(.98);
}

button:disabled{

    opacity:.55;

    cursor:not-allowed;
}


/* =====================================================
   MENSAGENS
===================================================== */

.mensagem{

    display:none;

    margin-top:25px;

    padding:20px;

    border-radius:15px;

    text-align:center;

    font-family:Arial,sans-serif;

    font-size:17px;

    line-height:1.7;
}

.sucesso{

    display:block;

    background:#101b14;

    border:1px solid #496f53;

    color:#9dd5aa;
}

.erro{

    display:block;

    background:#1b1010;

    border:1px solid #713d3d;

    color:#e69b9b;
}


/* =====================================================
   RODAPÉ
===================================================== */

footer{

    text-align:center;

    padding:35px;

    color:#777;

    font-family:Arial,sans-serif;

    font-size:14px;
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

    .logo{

        width:240px;
        height:170px;

        font-size:88px;
    }

    .intro-conteudo h1{

        font-size:29px;

        letter-spacing:4px;
    }

    header h1{

        font-size:34px;
    }

    .container{

        margin:25px 13px;

        padding:28px 20px;

        border-radius:22px;
    }

    h2{

        font-size:28px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     INTRO
===================================================== -->

<div id="intro">

    <div class="intro-conteudo">

        <div class="logo">
            N L
        </div>

        <h1>NIKKY LASHES</h1>

        <p>Beauty Studio</p>

    </div>

</div>


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header>

    <h1>✦ Nikky Lashes</h1>

    <p>Realce sua beleza, agende seu horário</p>

</header>


<!-- =====================================================
     AGENDA
===================================================== -->

<div class="container">

    <h2>Agende seu horário</h2>

    <p class="subtitulo">
        Escolha o melhor dia e horário para você.
    </p>


    <form id="formAgendamento">


        <label>Nome da cliente</label>

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
            required
        >


        <label>WhatsApp</label>

        <input
            type="tel"
            id="whatsapp"
            placeholder="(11) 99999-9999"
            required
        >


        <label>Dia</label>

        <select id="data" required>

            <option value="">
                Escolha o dia
            </option>

        </select>


        <label>Horário</label>

        <select
            id="horario"
            required
            disabled
        >

            <option value="">
                Escolha primeiro o dia
            </option>

        </select>


        <label>Modelo de cílios</label>

        <select id="modelo" required>

            <option value="">
                Selecione o modelo
            </option>

            <option
                value="Clássico"
                data-valor="100"
            >
                Clássico — R$ 100,00
            </option>

            <option
                value="Volume Brasileiro"
                data-valor="120"
            >
                Volume Brasileiro — R$ 120,00
            </option>

            <option
                value="Volume Russo"
                data-valor="140"
            >
                Volume Russo — R$ 140,00
            </option>

            <option
                value="Volume Híbrido"
                data-valor="130"
            >
                Volume Híbrido — R$ 130,00
            </option>

            <option
                value="Mega Volume"
                data-valor="160"
            >
                Mega Volume — R$ 160,00
            </option>

            <option
                value="Manutenção"
                data-valor="90"
            >
                Manutenção — R$ 90,00
            </option>

        </select>


        <div
            class="valor"
            id="valor"
        >
            Valor do procedimento: R$ 0,00
        </div>


        <button
            type="submit"
            id="botao"
        >
            Confirmar agendamento
        </button>


    </form>


    <div
        id="mensagem"
        class="mensagem"
    ></div>

</div>


<footer>

    Nikky Lashes ✦

</footer>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://annmuqmsdjzysusnfklf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_L_EQc3998bYRyLap6B9Jzg_sDfz5wuV";


/* =====================================================
   ELEMENTOS
===================================================== */

const dataSelect =
document.getElementById("data");

const horarioSelect =
document.getElementById("horario");

const modeloSelect =
document.getElementById("modelo");

const valorDiv =
document.getElementById("valor");

const form =
document.getElementById("formAgendamento");

const mensagem =
document.getElementById("mensagem");

const botao =
document.getElementById("botao");


/* =====================================================
   HORÁRIOS
===================================================== */

const horarios = [

    "09:00",
    "10:00",
    "11:00",
    "12:00",
    "13:00",
    "14:00",
    "15:00",
    "16:00",
    "17:00",
    "18:00"

];


/* =====================================================
   CRIAR DIAS
===================================================== */

function criarDias(){

    const hoje = new Date();

    for(let i = 0; i < 60; i++){

        const data =
            new Date(hoje);

        data.setDate(
            hoje.getDate() + i
        );

        const ano =
            data.getFullYear();

        const mes =
            String(
                data.getMonth()+1
            ).padStart(2,"0");

        const dia =
            String(
                data.getDate()
            ).padStart(2,"0");

        const valor =
            `${ano}-${mes}-${dia}`;

        const texto =
            `${dia}/${mes}/${ano}`;

        const option =
            document.createElement("option");

        option.value = valor;

        option.textContent = texto;

        dataSelect.appendChild(option);

    }

}


/* =====================================================
   HORÁRIOS OCUPADOS
===================================================== */

async function carregarHorarios(){

    const data =
        dataSelect.value;

    horarioSelect.innerHTML =
        '<option value="">Carregando...</option>';

    horarioSelect.disabled = true;


    if(!data){

        horarioSelect.innerHTML =
            '<option value="">Escolha primeiro o dia</option>';

        return;
    }


    try{

        const resposta =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/rpc/horarios_ocupados",

                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    },

                    body:JSON.stringify({

                        p_data:data

                    })

                }

            );


        const dados =
            await resposta.json();


        if(!resposta.ok){

            throw new Error(
                JSON.stringify(dados)
            );

        }


        const ocupados =
            dados.map(

                item =>
                    String(
                        item.horario
                    ).substring(0,5)

            );


        horarioSelect.innerHTML =
            '<option value="">Escolha o horário</option>';


        horarios.forEach(

            hora => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value = hora;


                if(
                    ocupados.includes(hora)
                ){

                    option.disabled = true;

                    option.textContent =
                        hora +
                        " - OCUPADO";

                }
                else{

                    option.textContent =
                        hora;

                }


                horarioSelect.appendChild(
                    option
                );

            }

        );


        horarioSelect.disabled = false;


    }
    catch(erro){

        console.error(erro);

        horarioSelect.innerHTML =
            '<option value="">Erro ao carregar horários</option>';

    }

}


dataSelect.addEventListener(
    "change",
    carregarHorarios
);


/* =====================================================
   VALOR
===================================================== */

modeloSelect.addEventListener(
    "change",
    function(){

        const opcao =
            modeloSelect.options[
                modeloSelect.selectedIndex
            ];

        const valor =
            Number(
                opcao.dataset.valor || 0
            );


        valorDiv.textContent =
            "Valor do procedimento: R$ " +

            valor
                .toFixed(2)
                .replace(".",",");

    }
);


/* =====================================================
   AGENDAMENTO
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        mensagem.className =
            "mensagem";

        mensagem.style.display =
            "none";


        botao.disabled = true;

        botao.textContent =
            "Agendando...";


        const nome =
            document
                .getElementById("nome")
                .value
                .trim();


        const whatsapp =
            document
                .getElementById("whatsapp")
                .value
                .trim();


        const data =
            dataSelect.value;


        const horario =
            horarioSelect.value;


        const modelo =
            modeloSelect.value;


        const opcao =
            modeloSelect.options[
                modeloSelect.selectedIndex
            ];


        const valor =
            Number(
                opcao.dataset.valor || 0
            );


        try{

            const resposta =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/rpc/fazer_agendamento",

                    {

                        method:"POST",

                        headers:{

                            "Content-Type":
                                "application/json",

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY

                        },

                        body:JSON.stringify({

                            p_nome:
                                nome,

                            p_whatsapp:
                                whatsapp,

                            p_data:
                                data,

                            p_horario:
                                horario,

                            p_modelo:
                                modelo,

                            p_valor:
                                valor

                        })

                    }

                );


            const resultado =
                await resposta.json();


            if(!resposta.ok){

                throw new Error(
                    JSON.stringify(resultado)
                );

            }


            if(
                resultado &&
                resultado.sucesso === false
            ){

                throw new Error(
                    resultado.mensagem ||
                    "Horário indisponível."
                );

            }


            mensagem.className =
                "mensagem sucesso";


            mensagem.innerHTML = `

                ✦ <strong>
                Agendamento realizado com sucesso!
                </strong>

                <br><br>

                Cliente: ${nome}

                <br>

                Data:
                ${data.split("-").reverse().join("/")}

                <br>

                Horário: ${horario}

                <br>

                Modelo: ${modelo}

                <br>

                Valor:
                R$ ${valor.toFixed(2).replace(".",",")}

                <br><br>

                ✦ Nikky Lashes agradece sua preferência!

            `;


            mensagem.style.display =
                "block";


            form.reset();


            valorDiv.textContent =
                "Valor do procedimento: R$ 0,00";


            horarioSelect.innerHTML =
                '<option value="">Escolha primeiro o dia</option>';

            horarioSelect.disabled =
                true;


        }
        catch(erro){

            console.error(erro);


            mensagem.className =
                "mensagem erro";


            mensagem.innerHTML =
                "❌ Não foi possível realizar o agendamento.<br><br>" +
                "Esse horário pode ter sido reservado por outra cliente. " +
                "Atualize a página e tente novamente.";


            mensagem.style.display =
                "block";

        }


        botao.disabled =
            false;

        botao.textContent =
            "Confirmar agendamento";

    }
);


/* =====================================================
   INICIAR
===================================================== */

criarDias();

</script>

</body>
</html>
